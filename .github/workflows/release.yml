name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

concurrency: crates-io-release

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      publish: ${{ steps.prepare.outputs.publish }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate, commit, and tag release
        id: prepare
        env:
          INCREMENT: ${{ inputs.increment }}
        run: bash .github/scripts/prepare-release.sh "$INCREMENT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.prepare.outputs.publish == 'true'
        id: auth
      - name: Publish to crates.io
        if: steps.prepare.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  build:
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v${{ needs.publish.outputs.version }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/fledgling dist/
          tar -czf fledgling-${{ matrix.target }}.tar.gz -C dist fledgling
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/fledgling.exe dist/
          Compress-Archive -Path dist/fledgling.exe -DestinationPath fledgling-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v7
        with:
          name: fledgling-${{ matrix.target }}
          path: fledgling-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  github-release:
    needs: [publish, build]
    if: needs.publish.outputs.publish == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: fledgling-*
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.publish.outputs.version }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
