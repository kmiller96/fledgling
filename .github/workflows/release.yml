name: Release

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

concurrency: crates-io-release

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      publish: ${{ steps.prepare.outputs.publish }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate, commit, and tag release
        id: prepare
        env:
          INCREMENT: ${{ inputs.increment }}
        run: bash .github/scripts/prepare-release.sh "$INCREMENT"
      - uses: rust-lang/crates-io-auth-action@v1
        if: steps.prepare.outputs.publish == 'true'
        id: auth
      - name: Publish to crates.io
        if: steps.prepare.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  github-release:
    needs: publish
    if: needs.publish.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.publish.outputs.version }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes

  build:
    needs: [publish, github-release]
    if: needs.publish.outputs.publish == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      ref: v${{ needs.publish.outputs.version }}
      tag: v${{ needs.publish.outputs.version }}
