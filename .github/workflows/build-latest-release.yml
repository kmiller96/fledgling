name: Build latest release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve latest published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_OUTPUT"

  build:
    needs: latest-release
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.latest-release.outputs.tag }}
