name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate crate
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: docker compose -f tests/scenarios/postgres/compose.yaml up -d --wait
      - run: bash .github/scripts/check.sh
        env:
          FLEDGLING_TEST_POSTGRES_URL: postgresql://fledgling:fledgling@127.0.0.1:55432/fledgling_test
      - if: always()
        run: docker compose -f tests/scenarios/postgres/compose.yaml down

  build-commit:
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}
