name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  validate:
    name: Validate crate
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: bash .github/scripts/check.sh
      - name: Build and smoke-test candidate
        if: github.event_name == 'push'
        run: |
          cargo build --release --locked
          target/release/fledgling --version
          tar -czf target/fledgling-linux.tar.gz -C target/release fledgling
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: fledgling-linux-${{ github.sha }}
          path: target/fledgling-linux.tar.gz
