[package]
name = "fledgling"
version = "0.2.2"
edition = "2024"
description = "An early-stage CLI for managing database schemas as code."
license = "MIT"
repository = "https://github.com/kmiller96/fledgling"
exclude = ["/.github"]

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
inquire = { version = "0.9.5", default-features = false, features = ["crossterm"] }
native-tls = "0.2"
pg_query = "6.2"
postgres = "0.19"
postgres-native-tls = "0.5"
rusqlite = { version = "0.40.0", features = ["bundled", "hooks"] }
serde = { version = "1", features = ["derive"] }
sqlite3-parser = "0.17.0"
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }

[dev-dependencies]
dir-test = "0.4"

[[test]]
name = "postgres"
path = "tests/postgres/tests.rs"

[[test]]
name = "sqlite"
path = "tests/sqlite/tests.rs"
